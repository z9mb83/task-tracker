# OpenAPI schema for the ChatGPT custom GPT ("Actions" > Import from schema).
# Replace YOUR-DASHBOARD.vercel.app with your Vercel domain (no trailing slash).
openapi: 3.1.0
info:
  title: Task Tracker
  version: 1.0.0
  description: Adds tasks for employees in the Task Tracker sheet.
servers:
  - url: https://YOUR-DASHBOARD.vercel.app
paths:
  /api/gpt/context:
    get:
      operationId: getContext
      summary: Today's date and the active employee names
      description: Call this first, so employee names and today's date are exact.
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  today: { type: string, description: "yyyy-MM-dd, Indian time" }
                  timeZone: { type: string }
                  employees: { type: array, items: { type: string } }
                  priorities: { type: array, items: { type: string } }
                  timeLimits: { type: array, items: { type: integer } }
                  offices: { type: array, items: { type: string } }
  /api/gpt/tasks:
    post:
      operationId: addTasks
      summary: Add one or more tasks for employees
      description: Adds each task as an approved task in the Task Tracker sheet, assigned to the named employee. Confirm the list with the admin before calling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                tasks:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [task, assignee, due, startTime]
                    properties:
                      task: { type: string, maxLength: 200, description: "Short task title" }
                      details: { type: string, maxLength: 2000 }
                      assignee: { type: string, description: "Employee name exactly as in getContext" }
                      due: { type: string, description: "Due date yyyy-MM-dd" }
                      startTime: { type: string, description: "Start time 24h HH:MM, e.g. 10:00 or 14:30" }
                      limit: { type: integer, enum: [30, 45, 60], description: "Minutes to finish (default 45)" }
                      priority: { type: string, enum: [High, Medium, Low], description: "Default Medium" }
                      sendNow: { type: boolean, description: "Email the employee now (default false; the daily email covers it)" }
      responses:
        "200":
          description: Per-task results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        ok: { type: boolean }
                        id: { type: string, description: "Ticket ID, e.g. T-0042" }
                        task: { type: string }
                        employee: { type: string }
                        due: { type: string }
                        error: { type: string }
components:
  securitySchemes:
    gptKey:
      type: http
      scheme: bearer
      description: The GPT_API_KEY value from Vercel
security:
  - gptKey: []
